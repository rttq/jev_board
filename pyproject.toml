[project]
name = "jev_board"
version = "0.1.0"
description = "Local workbench for testing propositions against TypeSafe Jev"
requires-python = ">=3.11"
dependencies = ["typesafe-sdk"]

[project.scripts]
jevbench = "jev_board.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["jev_board"]
